<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="280" height="64">
  <defs>
    <!-- Globe Gradient -->
    <linearGradient id="globeGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#EDE6D6" />
      <stop offset="100%" stop-color="#D8CEB8" />
    </linearGradient>
    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="32" y1="10" x2="54" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#708B67" />
      <stop offset="50%" stop-color="#526B4B" />
      <stop offset="100%" stop-color="#394A35" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#394A35" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- ICON (64x64 centered at x=32, y=32) -->
  <g filter="url(#softGlow)">
    <!-- Base globe sphere -->
    <circle cx="32" cy="32" r="22" fill="url(#globeGrad)" stroke="#C6A66B" stroke-width="1.8" />
    
    <!-- Longitude ellipse -->
    <ellipse cx="32" cy="32" rx="10" ry="22" fill="none" stroke="#C6A66B" stroke-width="1.2" opacity="0.85" />
    
    <!-- Equator and latitude lines -->
    <line x1="10" y1="32" x2="54" y2="32" stroke="#C6A66B" stroke-width="1.2" opacity="0.85" />
    <path d="M14 22 Q 32 26 50 22" fill="none" stroke="#C6A66B" stroke-width="1.0" opacity="0.7" />
    <path d="M14 42 Q 32 38 50 42" fill="none" stroke="#C6A66B" stroke-width="1.0" opacity="0.7" />

    <!-- Emerging Botanical Olive Leaf -->
    <path d="M30 40 C30 22 41 11 54 9 C54 26 44 38 30 40 Z" fill="url(#leafGrad)" stroke="#EDE6D6" stroke-width="1.2" />
    <path d="M33 37 Q 42 24 51 12" fill="none" stroke="#C6A66B" stroke-width="1.0" stroke-linecap="round" />
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <text x="68" y="38" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="700" fill="#252B23" letter-spacing="-0.3">Nutri<tspan fill="#526B4B">Globe</tspan></text>
  <text x="70" y="49" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#72796E" letter-spacing="1.8">PRECISION NUTRITION</text>
  
  <!-- Version badge -->
  <rect x="215" y="24" width="30" height="15" rx="7.5" fill="#E9EEE3" stroke="#DCE2D6" stroke-width="1" />
  <text x="221" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#526B4B">2.0</text>
</svg>
